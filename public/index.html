<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJAPANI SESSION · LIVE</title>
<style>
  :root{
    --bg:#050505;
    --card:#121212;
    --card-border:#2a1010;
    --accent:#e11d2e;
    --orange:#ff6b1a;
    --text:#f5f5f5;
    --muted:#a0a0a0;
    --ok:#22c55e;
    --err:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(225,29,46,0.18),transparent),
               radial-gradient(circle at 80% 80%,rgba(255,107,26,0.08),transparent),#050505;
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;
    padding:28px 16px 40px;
  }
  .wrap{max-width:440px;width:100%}
  .logo-wrap{text-align:center;margin-bottom:22px}
  .logo-img{
    width:180px;height:180px;object-fit:contain;border-radius:26px;
    box-shadow:0 0 0 2px rgba(255,60,40,0.4),0 12px 40px rgba(225,29,46,0.35),0 0 60px rgba(225,29,46,0.15);
  }
  .live-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,#e11d2e,#c4111f);color:#fff;
    font-size:11px;font-weight:800;letter-spacing:1.5px;
    padding:5px 12px;border-radius:20px;margin-top:14px;
    box-shadow:0 4px 15px rgba(225,29,46,0.4);
  }
  .live-dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
  .logo-title{margin-top:12px;font-size:22px;font-weight:800;letter-spacing:1px}
  .logo-title span{color:var(--accent)}
  .logo-sub{color:var(--muted);font-size:13px;margin-top:4px}
  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),var(--orange),var(--accent),transparent);
  }
  .tabs{display:flex;gap:6px;margin-bottom:20px;background:#0a0a0a;padding:5px;border-radius:14px;border:1px solid #1f1f1f}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px;transition:.2s}
  .tab.active{background:linear-gradient(135deg,var(--accent),#b91c1c);color:#fff;box-shadow:0 4px 14px rgba(225,29,46,.35)}
  .panel{display:none}.panel.active{display:block}
  input[type=text]{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #2a2a2a;background:#0a0a0a;color:var(--text);font-size:15px;outline:none}
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,46,.2)}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:7px;font-weight:500}
  button.primary{
    width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#c4111f);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 20px rgba(225,29,46,.35);
  }
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  .qr-box{text-align:center;margin-top:18px}
  .qr-box img{width:230px;height:230px;border-radius:16px;background:#fff;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .code-box{text-align:center;margin-top:18px;font-size:32px;letter-spacing:8px;font-weight:800;background:#0a0a0a;border:1.5px dashed var(--accent);border-radius:14px;padding:20px;color:#fff}
  .status{text-align:center;color:var(--muted);font-size:13.5px;margin-top:14px;min-height:20px;font-weight:500}
  .status.err{color:var(--err)}.status.ok{color:var(--ok)}
  .session-box{margin-top:18px}
  textarea{width:100%;min-height:115px;background:#0a0a0a;color:var(--ok);border:1px solid #1a3a1a;border-radius:12px;padding:13px;font-size:12px;word-break:break-all;resize:vertical}
  .copy-btn{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1.5px solid var(--ok);background:transparent;color:var(--ok);font-weight:700;cursor:pointer;font-size:14px}
  .warn{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.55;background:rgba(255,255,255,.03);padding:10px 12px;border-radius:10px;border-left:3px solid #333}
  .hidden{display:none}
  footer{text-align:center;color:#666;font-size:11.5px;margin-top:22px}
  footer b{color:#999}
</style>
</head>
